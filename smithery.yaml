# Smithery configuration — Kairos Signal MCP server
# stdio bridge to the hosted Streamable-HTTP MCP endpoint.
# The bridge exposes the hosted tool catalog, including register_agent.
# Starter-credit eligibility is conditional; inspect the returned balance.
# A configured header key does not replace required api_key tool arguments.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: API Key
        description: "Optional existing Kairos API key (register_agent gets you one free)"
      mcpUrl:
        type: string
        title: MCP URL
        description: "Hosted endpoint override"
        default: "https://kairossignal.com/mcp/"
  commandFunction: |-
    (config) => ({
      "command": "npx",
      "args": ["-y", "kairos-mcp-server"],
      "env": {
        ...(config.apiKey ? { "KAIROS_API_KEY": config.apiKey } : {}),
        ...(config.mcpUrl ? { "KAIROS_MCP_URL": config.mcpUrl } : {})
      }
    })
